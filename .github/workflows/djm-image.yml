# DJM: eigen Lychee-image bouwen naar ghcr.io/sjkanon/lychee-djm (zie djm/README.md).
# Draait op GitHub-runners (openbare fork, geen eigen runner, geen geheimen behalve GITHUB_TOKEN).
# Met `frankenphp` kan de basis vervangen worden door een nieuwere FrankenPHP-build dan upstream vastzet,
# bijvoorbeeld na een PHP-beveiligingsfix. Er wordt alleen gepusht als PHP >= min_php.
name: djm-image

on:
  workflow_dispatch:
    inputs:
      frankenphp:
        description: "FrankenPHP-basis (leeg = zoals upstream), bijv. dunglas/frankenphp:1.13.1-php8.4-trixie"
        required: false
        default: ""
      min_php:
        description: "Minimale PHP-versie"
        required: false
        default: "8.4.27"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: djm-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/sjkanon/lychee-djm
      MIN_PHP: ${{ inputs.min_php || '8.4.27' }}
      FRANKENPHP: ${{ inputs.frankenphp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devel

      - name: Basis vervangen
        if: env.FRANKENPHP != ''
        run: |
          set -euo pipefail
          [[ $FRANKENPHP =~ ^dunglas/frankenphp:[A-Za-z0-9._-]+$ ]] || { echo "::error::ongeldige basis: $FRANKENPHP"; exit 1; }
          sed -i -E "s#^FROM dunglas/frankenphp:[^ ]+#FROM $FRANKENPHP#" Dockerfile
          grep -n '^FROM dunglas/frankenphp' Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Bouwen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          pull: true
          tags: lychee-djm:test

      - name: PHP-versie controleren
        id: php
        run: |
          set -euo pipefail
          V=$(docker run --rm --entrypoint php lychee-djm:test -r 'echo PHP_VERSION;')
          L=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' version.md)
          echo "PHP $V, Lychee $L" | tee -a "$GITHUB_STEP_SUMMARY"
          php_ok=$(docker run --rm --entrypoint php lychee-djm:test -r "echo version_compare(PHP_VERSION, '$MIN_PHP', '>=') ? 'ja' : 'nee';")
          [ "$php_ok" = ja ] || { echo "::error::PHP $V is lager dan $MIN_PHP; niet gepusht"; exit 1; }
          echo "php=$V" >> "$GITHUB_OUTPUT"
          echo "lychee=$L" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pushen
        run: |
          set -euo pipefail
          T="v${{ steps.php.outputs.lychee }}-php${{ steps.php.outputs.php }}"
          for t in latest "$T"; do
            docker tag lychee-djm:test "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "Gepusht: $IMAGE:latest en $IMAGE:$T" | tee -a "$GITHUB_STEP_SUMMARY"
